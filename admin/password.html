<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Magetsi admin: change password</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/admin-auth.css">
</head>
<body>
<main class="wrap">
  <h1>Change password</h1>
  <p>Signed in as <b><!--USER--></b>. <span class="note"><!--NOTICE--></span></p>
  <form method="post" action="/admin/password">
    <input type="text" name="username" value="<!--USER-->" autocomplete="username" hidden>
    <label for="current">Current password</label>
    <input id="current" name="current" type="password" autocomplete="current-password" required autofocus>
    <label for="password">New password (at least 10 characters)</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
    <label for="confirm">New password again</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="10" required>
    <div class="bad" role="alert"><!--ERROR--></div>
    <button type="submit">Save password</button>
  </form>
  <form method="post" action="/admin/logout"><button class="ghost" type="submit">Sign out</button></form>
</main>
</body>
</html>
