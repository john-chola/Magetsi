<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Magetsi admin: sign in</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/admin-auth.css">
</head>
<body>
<main class="wrap">
  <h1>Magetsi admin</h1>
  <p>Sign in with your admin account. Ask another admin if you need one.</p>
  <form method="post" action="/admin/login">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div class="bad" role="alert"><!--ERROR--></div>
    <button type="submit">Sign in</button>
  </form>
  <p><a href="/">Back to the app</a></p>
</main>
</body>
</html>
